spring.application.name=leaf-store
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/leaf;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
store.admin-password=${ADMIN_PASSWORD:LeafAdmin!2026}
spring.config.import=optional:file:./payment.properties
store.razorpay.key-id=${RAZORPAY_KEY_ID:}
store.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
store.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
store.razorpay.api-base=${RAZORPAY_API_BASE:https://api.razorpay.com/v1}
